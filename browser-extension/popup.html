<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContextBridge Clip</title><style>
body{font:14px system-ui,sans-serif;width:340px;margin:0;padding:14px;color:#0f172a}h1{font-size:17px;margin:0 0 8px}p{font-size:12px;color:#475569}textarea,input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;margin:4px 0 10px}textarea{height:170px}button{background:#0f766e;color:white;border:0;border-radius:6px;padding:9px 12px;font-weight:600;cursor:pointer;margin:2px 4px 2px 0}button.secondary{background:#fff;color:#0f172a;border:1px solid #cbd5e1}#status{min-height:18px}
</style></head>
<body><h1>ContextBridge Clip</h1><p>Capture text you selected or the chat messages currently rendered on supported pages. Review and edit before copying. Collapsed or virtualized history may not be included.</p><button id="capture" class="secondary">Capture selection</button><button id="capture-chat" class="secondary">Capture visible chat</button><textarea id="text" aria-label="Conversation text" placeholder="Captured text appears here. You can edit it before copying."></textarea><label for="url">ContextBridge URL</label><input id="url" type="url" value="http://localhost:3000"><button id="send">Copy text and open app</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
